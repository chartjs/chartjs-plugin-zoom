name: Publish to npm

on:
  release:
    types: [published]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.trim.outputs.version }}
    steps:
      - id: trim
        run: echo "::set-output name=version::${TAG:1}"
        env:
          TAG: ${{ github.event.release.tag_name }}

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Test
      run: |
        npm ci
        npx playwright install --with-deps chromium firefox
        npm test

  publish-npm:
    needs: [test, setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Setup and build
        run: |
          npm ci
          npm run build
          npm pack

      - name: Publish @next
        run: npm publish --tag next
        if: github.event.release.prerelease == true
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}

      - name: Publish @latest
        run: npm publish --tag latest
        if: github.event.release.prerelease == false
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}

      - name: Upload chartjs-plugin-zoom.tgz
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ format('chartjs-plugin-zoom-{0}.tgz', needs.setup.outputs.version) }}
          asset_name: ${{ format('chartjs-plugin-zoom-{0}.tgz', needs.setup.outputs.version) }}
          asset_content_type: application/gzip

      - name: Upload chartjs-plugin-zoom.js
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/chartjs-plugin-zoom.js
          asset_name: chartjs-plugin-zoom.js
          asset_content_type: application/javascript

      - name: Upload chartjs-plugin-zoom.min.js
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/chartjs-plugin-zoom.min.js
          asset_name: chartjs-plugin-zoom.min.js
          asset_content_type: application/javascript

      - name: Build docs (version)
        run: |
          ./scripts/docs-config.sh "$VERSION" release
          npm run docs
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Generate docs deploy token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve docs deploy bot user
        id: bot
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          echo "name=${BOT_NAME}" >> "$GITHUB_OUTPUT"
          echo "id=$(gh api "/users/${BOT_NAME}" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Release to GitHub Pages (version)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.app-token.outputs.token }}
          user_name: ${{ steps.bot.outputs.name }}
          user_email: ${{ steps.bot.outputs.id }}+${{ steps.bot.outputs.name }}@users.noreply.github.com
          publish_dir: dist/docs
          destination_dir: ${{ needs.setup.outputs.version }}

  publish-docs:
    needs: [test, setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Build docs (latest/next)
        run: |
          npm ci
          npm run build
          ./scripts/docs-config.sh "$VERSION"
          npm run docs
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Generate docs deploy token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve docs deploy bot user
        id: bot
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          echo "name=${BOT_NAME}" >> "$GITHUB_OUTPUT"
          echo "id=$(gh api "/users/${BOT_NAME}" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Release to GitHub Pages (latest)
        if: github.event.release.prerelease == false
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.app-token.outputs.token }}
          user_name: ${{ steps.bot.outputs.name }}
          user_email: ${{ steps.bot.outputs.id }}+${{ steps.bot.outputs.name }}@users.noreply.github.com
          publish_dir: dist/docs
          destination_dir: latest

      - name: Release to GitHub Pages (next)
        if: github.event.release.prerelease == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.app-token.outputs.token }}
          user_name: ${{ steps.bot.outputs.name }}
          user_email: ${{ steps.bot.outputs.id }}+${{ steps.bot.outputs.name }}@users.noreply.github.com
          publish_dir: dist/docs
          destination_dir: next
