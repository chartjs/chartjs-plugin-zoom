name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: install
      run: npm ci

    - name: install browsers
      run: npx playwright install --with-deps chromium firefox

    - name: lint
      run: npm run lint

    - name: typecheck
      run: npm run typecheck

    - name: typecheck docs
      run: npm run typecheck:docs

    - name: build
      run: npm run build

    - name: test
      run: npm test

    - name: Coveralls Paraller - Unit
      if: matrix.os == 'ubuntu-latest'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        file: './coverage/unit/lcov.info'
        flag-name: unit
        parallel: true

    # Vitest merges Chromium and Firefox into one report.
    - name: Coveralls Parallel - Browser
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        file: './coverage/browser/lcov.info'
        flag-name: ${{ matrix.os }}-browser
        parallel: true

  finish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
